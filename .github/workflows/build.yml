name: Build OpenWrt v6.x

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Download and Extract ImageBuilder
        run: |
          wget https://archive.openwrt.org/releases/19.07.10/targets/ramips/mt76x8/openwrt-imagebuilder-19.07.10-ramips-mt76x8.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-19.07.10-ramips-mt76x8.Linux-x86_64.tar.xz
          
      - name: Build Firmware Image
        run: |
          cd openwrt-imagebuilder-19.07.10-ramips-mt76x8.Linux-x86_64
          make image PROFILE=tplink_tl-wr840n-v4 PACKAGES="-luci -kmod-usb-core -kmod-usb2"

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wr840n-v6-firmware
          path: openwrt-imagebuilder-19.07.10-ramips-mt76x8.Linux-x86_64/bin/targets/ramips/mt76x8/*.bin
