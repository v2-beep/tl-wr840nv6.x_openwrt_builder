name: Build OpenWrt v6.x

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and Compile OpenWrt inside Ubuntu 20.04
        run: |
          docker run --rm -v ${{ github.workspace }}:/build ubuntu:20.04 bash -c "
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python2 python3 file ccache swig
            cd /build
            git clone --depth 1 -b openwrt-19.07 https://github.com/openwrt/openwrt.git source
            cd source
            ./scripts/feeds update -a
            ./scripts/feeds install -a
            echo 'CONFIG_TARGET_ramips=y' > .config
            echo 'CONFIG_TARGET_ramips_mt76x8=y' >> .config
            echo 'CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_tl-wr840n-v5=y' >> .config
            make defconfig
            make -j\$(nproc)
          "

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wr840n-v6-firmware
          path: source/bin/targets/ramips/mt76x8/*.bin
